<script>
  /* ==================== 常量 & 工具 ==================== */
  const SIDES = 6;
  const DICE_COUNT = 6;
  const rollOne = () => Math.floor(Math.random() * SIDES) + 1;

  const STORAGE_KEY = 'meal-planner-state-v1';
  const NAME_STORAGE_KEY = 'meal-planner-username-v1';
  const WEIGHTS_STORAGE_KEY = 'meal-planner-weights-v1';
  const DEFAULT_USER_NAME = '爱吃饭的某某';

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  /* ==================== DOM ==================== */
  const diceGrid     = document.getElementById('diceGrid');
  const rollBtn      = document.getElementById('rollBtn');
  const bubbleWrap   = document.getElementById('bubbleWrap');
  const bubbleText   = document.getElementById('bubbleText');
  const mealCaret    = document.getElementById('mealCaret');
  const responseWrap = document.getElementById('responseWrap');
  const responseArea = document.getElementById('responseArea');
  const emojiRow     = document.getElementById('emojiRow');
  const moodText     = document.getElementById('moodText');
  const moodCaret    = document.getElementById('moodCaret');
  const pageTitleText = document.getElementById('pageTitleText');

  const cuisineGrid  = document.getElementById('cuisineGrid');
  const cuisineCards = Array.from(document.querySelectorAll('.cuisine-card'));
  const randomBtn    = document.getElementById('randomBtn');
  const randomWrap   = document.getElementById('randomWrap');

  const futureGrid = document.getElementById('futureGrid');

  const budgetValue = document.getElementById('budgetValue');
  const menuBtn     = document.getElementById('menuBtn');
  const recordsWrap = document.getElementById('recordsWrap');
  const recordsList = document.getElementById('recordsList');
  const foodName    = document.getElementById('foodName');
  const foodPrice   = document.getElementById('foodPrice');
  const foodNote    = document.getElementById('foodNote');
  const addBtn      = document.getElementById('addBtn');
  const avatarCol   = document.getElementById('avatarCol');
  const avatarHead  = avatarCol.querySelector('.avatar-head');
  const collapseBanner = document.getElementById('collapseBanner');
  const collapsedSummary = document.getElementById('collapsedSummary');
  const summaryBudget  = document.getElementById('summaryBudget');
  const summaryCuisine = document.getElementById('summaryCuisine');
  const summaryFuture  = document.getElementById('summaryFuture');

  const userNameEl   = document.getElementById('userNameEl');
  const rulesBtn     = document.getElementById('rulesBtn');
  const settingsBtn  = document.getElementById('settingsBtn');

  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle    = document.getElementById('modalTitle');
  const modalBody     = document.getElementById('modalBody');
  const modalCloseBtn = document.getElementById('modalCloseBtn');

  /* ==================== 全局状态 ==================== */
  let hasRolled = false;
  let isRolling = false;
  let mealTimer = null;
  let moodTimer = null;

  let diceTotal = 0;
  let initialBudget = 0;
  let remaining = 0;
  let lastBubbleMessage = '';
  let chosenMoodIdx = null;

  let isAnimating = false;
  let isFinished  = false;
  let randomTimer = null;

  let futurePicksIdx = [];
  let chosenFutureIdx = null;
  let futureChosen = false;

  let isCollapsed = false;
  let atBottomOnce = false;

  const records = [];

  let currentDate = todayStr();

  // 跨天保留
  let userName = DEFAULT_USER_NAME;
  let futureWeights = [];

  /* ==================== 名称 & 权重读写 ==================== */
  function loadUserName() {
    try {
      const v = localStorage.getItem(NAME_STORAGE_KEY);
      return v && v.trim() ? v : DEFAULT_USER_NAME;
    } catch (e) {
      return DEFAULT_USER_NAME;
    }
  }

  function saveUserName(name) {
    try {
      localStorage.setItem(NAME_STORAGE_KEY, name);
    } catch (e) {}
  }

  function loadWeights() {
    const fallback = new Array(futures.length).fill(1);
    try {
      const raw = localStorage.getItem(WEIGHTS_STORAGE_KEY);
      if (!raw) return fallback;
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === futures.length) {
        return arr.map(w => {
          const n = Number(w);
          if (!Number.isFinite(n)) return 1;
          return Math.max(0, Math.min(9, Math.round(n)));
        });
      }
      return fallback;
    } catch (e) {
      return fallback;
    }
  }

  function saveWeights() {
    try {
      localStorage.setItem(WEIGHTS_STORAGE_KEY, JSON.stringify(futureWeights));
    } catch (e) {}
  }

  /* ==================== 顺序出现 ==================== */
  function revealBox(n, scroll = true) {
    const box = document.getElementById('box' + n);
    if (!box || !box.hidden) return;
    box.hidden = false;
    void box.offsetWidth;
    box.classList.add('reveal-in');
    if (scroll) {
      setTimeout(() => {
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 140);
    }
  }

  /* ==================== 跟随鼠标弥散 ==================== */
  function bindPointerGlow(el) {
    el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 100;
      const y = ((e.clientY - r.top) / r.height) * 100;
      el.style.setProperty('--mx', `${x}%`);
      el.style.setProperty('--my', `${y}%`);
    });
  }

  bindPointerGlow(rollBtn);
  cuisineCards.forEach(bindPointerGlow);
  bindPointerGlow(randomBtn);
  bindPointerGlow(addBtn);

  /* ==================== 抚摸小人的脸，暂时擦去眼泪 ==================== */
  if (avatarHead) {
    const wipeOn = () => {
      if (document.body.classList.contains('over-budget')) {
        document.body.classList.add('wiping-tears');
      }
    };
    const wipeOff = () => {
      document.body.classList.remove('wiping-tears');
    };

    avatarHead.addEventListener('pointerenter', wipeOn);
    avatarHead.addEventListener('pointerdown', wipeOn);
    avatarHead.addEventListener('pointermove', (e) => {
      if (e.buttons > 0) wipeOn();
    });
    avatarHead.addEventListener('pointerup', wipeOff);
    avatarHead.addEventListener('pointerleave', wipeOff);
    avatarHead.addEventListener('pointercancel', wipeOff);
  }

  /* ==================== 心情 emoji ==================== */
  const moods = [
    { emoji: '🎉', text: '玉盘珍馐，来支持了～' },
    { emoji: '👌', text: '好的呀没问题。。' },
    { emoji: '🙄', text: '行…… 真小气' },
    { emoji: '💨', text: '？？？？？？' }
  ];

  moods.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'emoji-bubble';
    btn.innerHTML = `<span class="emoji-glyph">${m.emoji}</span>`;
    btn.setAttribute('aria-label', `心情：${m.text}`);
    btn.addEventListener('click', () => selectMood(i));
    bindPointerGlow(btn);
    emojiRow.appendChild(btn);
  });

  function selectMood(idx) {
    if (chosenMoodIdx !== null) return;
    chosenMoodIdx = idx;
    responseArea.classList.add('mood-mode');

    setTimeout(() => {
      moodTimer = typeText(moodText, moodCaret, moods[idx].text, 55, () => {
        setTimeout(() => {
          revealBox(2);
          saveState();
        }, 400);
      });
    }, 300);

    saveState();
  }

  /* ==================== 骰子 ==================== */
  function setDieValue(el, v) {
    el.textContent = v;
    el.style.color = v === 1 ? '#ff8a8a' : v >= 4 ? '#FFCB05' : '#8b95a5';
    el.style.textShadow = v === 1
      ? '0 0 12px rgba(255,138,138,.35)'
      : v >= 4
        ? '0 0 12px rgba(255,203,5,.30)'
        : 'none';
  }

  const dieSVG = `
    <svg class="die-shape" viewBox="0 0 100 100" aria-hidden="true">
      <polygon class="face-top"   points="20,35 40,15 100,15 80,35"/>
      <polygon class="face-side"  points="80,35 100,15 100,75 80,95"/>
      <polygon class="face-front" points="20,35 80,35 80,95 20,95"/>
      <g stroke="rgba(255,203,5,.20)" stroke-width="1.2" stroke-linejoin="round" fill="none">
        <polygon points="20,35 40,15 100,15 80,35"/>
        <polygon points="80,35 100,15 100,75 80,95"/>
        <polygon points="20,35 80,35 80,95 20,95"/>
        <line x1="20" y1="35" x2="20" y2="95"/>
      </g>
    </svg>
    <span class="die-value"></span>
  `;

  const dice = [];
  for (let i = 0; i < DICE_COUNT; i++) {
    const die = document.createElement('div');
    die.className = 'die';
    die.innerHTML = dieSVG;
    diceGrid.appendChild(die);
    setDieValue(die.querySelector('.die-value'), 6);
    dice.push(die);
  }

  function animateDie(die, duration) {
    return new Promise(resolve => {
      const valueEl = die.querySelector('.die-value');
      const startTime = performance.now();
      let lastSwap = 0;

      die.classList.remove('pop');
      die.classList.add('rolling');

      function frame(now) {
        if (now - lastSwap >= 50) {
          setDieValue(valueEl, rollOne());
          lastSwap = now;
        }
        if (now - startTime < duration) {
          requestAnimationFrame(frame);
        } else {
          const final = rollOne();
          setDieValue(valueEl, final);
          die.classList.remove('rolling');
          die.classList.add('pop');
          resolve(final);
        }
      }

      requestAnimationFrame(frame);
    });
  }

  function resetBubbles() {
    if (mealTimer) { clearInterval(mealTimer); mealTimer = null; }
    if (moodTimer) { clearInterval(moodTimer); moodTimer = null; }
    bubbleWrap.classList.remove('open');
    responseWrap.classList.remove('open');
    responseArea.classList.remove('mood-mode');
    bubbleText.textContent = '';
    moodText.textContent = '';
    mealCaret.style.display = 'none';
    moodCaret.style.display = 'none';
  }

  function typeText(el, caret, text, speed, onDone) {
    el.textContent = '';
    caret.style.display = 'inline-block';
    let i = 0;
    const timer = setInterval(() => {
      el.textContent = text.slice(0, i + 1);
      i++;
      if (i >= text.length) {
        clearInterval(timer);
        caret.style.display = 'none';
        if (onDone) onDone();
      }
    }, speed);
    return timer;
  }

  async function roll() {
    if (hasRolled || isRolling) return;
    hasRolled = true;
    isRolling = true;
    rollBtn.disabled = true;
    rollBtn.classList.add('used');
    resetBubbles();

    const baseDuration = 620;
    const stagger = 80;

    const results = await Promise.all(
      dice.map((die, i) => animateDie(die, baseDuration + i * stagger))
    );
    const total = results.reduce((a, b) => a + b, 0);

    diceTotal = total;

    const day = new Date().getDay();
    const hasBonus = (day === 5 || day === 6 || day === 0);
    const bonus = hasBonus ? 10 : 0;
    const budget = total + bonus;

    initialBudget = budget;
    remaining = budget;

    lastBubbleMessage = hasBonus
      ? `今日经费：${total}美元 + 10美元津贴 = ${budget}美元`
      : `今日经费：${total}美元`;

    updateBudgetDisplay();
    renderRecords();
    saveState();

    bubbleWrap.classList.add('open');
    setTimeout(() => {
      mealTimer = typeText(bubbleText, mealCaret, lastBubbleMessage, 60, () => {
        setTimeout(() => {
          responseWrap.classList.add('open');
          isRolling = false;
          saveState();
        }, 300);
      });
    }, 380);
  }

  rollBtn.addEventListener('click', roll);

  /* ==================== Box 2：菜系 ==================== */
  cuisineCards.forEach((card, i) => {
    card.addEventListener('click', () => {
      if (isAnimating || isFinished) return;
      const on = card.classList.toggle('selected');
      card.setAttribute('aria-pressed', on ? 'true' : 'false');
      updateRandomBtn();
      saveState();
    });
  });

  function updateRandomBtn() {
    const anySelected = cuisineCards.some((c) => c.classList.contains('selected'));
    randomBtn.disabled = !anySelected;
  }

  function startRandom() {
    if (isAnimating || isFinished) return;
    const pool = cuisineCards.filter((c) => c.classList.contains('selected'));
    if (pool.length === 0) return;

    isAnimating = true;
    randomBtn.disabled = true;

    cuisineCards.forEach((c) => {
      c.style.pointerEvents = 'none';
    });

    randomWrap.classList.add('gone');
    cuisineGrid.classList.remove('randomizing');

    /* 只选中一个菜系：跳过随机过程，直接红色锁定 */
    if (pool.length === 1) {
      finishRandom(pool);
      saveState();
      return;
    }

    cuisineCards.forEach((c) => {
      if (!c.classList.contains('selected')) c.classList.add('dimmed');
    });

    cuisineGrid.classList.add('randomizing');
    saveState();

    const steps = 12;
    const fast  = 60;
    const slow  = 380;
    let step = 0;
    let last = null;

    function tick() {
      if (last) last.classList.remove('flash');

      let pick;
      if (pool.length > 1) {
        do { pick = pool[Math.floor(Math.random() * pool.length)]; }
        while (pick === last);
      } else {
        pick = pool[0];
      }

      pick.classList.add('flash');
      last = pick;
      step++;

      if (step >= steps) {
        last.classList.remove('flash');
        finishRandom(pool);
        return;
      }

      const p = step / steps;
      const eased = 1 - Math.pow(1 - p, 3);
      const delay = fast + eased * (slow - fast);
      randomTimer = setTimeout(tick, delay);
    }

    tick();
  }

  function finishRandom(pool) {
    const winner = pool[Math.floor(Math.random() * pool.length)];

    cuisineCards.forEach((c) => {
      c.classList.remove('flash');
      c.classList.add('dimmed');
    });
    winner.classList.remove('dimmed');
    winner.classList.add('locked');

    cuisineGrid.classList.remove('randomizing');

    isAnimating = false;
    isFinished = true;
    randomTimer = null;

    setTimeout(() => {
      if (futureGrid.childElementCount === 0) {
        futurePicksIdx = pickWeightedIndices(3);
        renderFutures(futurePicksIdx, true);
      }
      revealBox(3);
      saveState();
    }, 260);
  }

  randomBtn.addEventListener('click', startRandom);

  /* ==================== Box 3：命运卡片 ==================== */
  const futures = [
    { title: '来自远方的祝福', text: '点外卖时，只计算餐品花销不计算其他费用。' },
    { title: '家的味道',       text: '只能自己下厨，但采购预算 +50%（共 ___ 美元）。' },
    { title: '残酷的家',       text: '只能自己下厨，并且不可以食用任何预制菜。采购预算无变化。' },
    { title: '喜新厌旧',       text: '只能尝试近两个月未吃过的饭店 / 未做过的菜品。' },
    { title: '燃烧我的卡路里', text: '只能食用标有卡路里，并且卡路里小于 750 的食物。' },
    { title: '甜蜜蜜',         text: '必须使用至少一半经费购买甜品 / 零食 / 冰淇淋。' },
    { title: '社交花蝴蝶',     text: '你必须邀请一位熟人一起进食，或必须在饭店与一人搭话闲聊。' },
    { title: '今晚我就要远航', text: '不能食用 Pierpont Commons / Courtyard / Target 路口 / Joe Pizza 路口的食物。' },
    { title: '青青草原',       text: '你只能食用素食。' },
    { title: '以巧克力',       text: '你只能在 happy hour 进食 / 食用当季特色菜单 / 隐藏菜单 / 使用任意折扣。' },
    { title: '聆听的艺术',     text: '你需要向店员询问推荐菜品，并且进行尝试。若在家吃饭，则需要遵循菜谱做饭。你不能点外卖。' },
    { title: '寝不言食不语',   text: '你在吃饭时不可以使用手机。' },
    { title: '感恩有你',       text: '今日你的所有小费必须给 18% 以上，并且计入花销。' },
    { title: '手握这个世界',   text: '今日你吃饭时全程不允许用任何叉子、勺子或筷子。' },
    { title: '绿叶菜',         text: '今天你必须吃一道以绿叶菜为主的食物。' },
    { title: '步行主义者',     text: '今日你不能点外卖，也不能骑车 / 打车前往饭馆或买菜。' },
    { title: '我爱我校',       text: '今天你只能吃可以用校园卡付款的饭店。' },
    { title: '蛋蛋大作战',     text: '今天你必须食用至少一个鸡蛋。' },
    { title: '最好运的小羊',   text: '今天如果前往饭店吃饭，只能点菜单每个类别的第一道菜或最后一道菜。' }
  ];

  /* 加权不放回抽 3 张（每张卡权重为池中份数） */
  function pickWeightedIndices(n) {
    const pool = futureWeights
      .map((w, i) => ({ i, w }))
      .filter(x => x.w > 0);

    if (pool.length === 0) {
      // 全部为 0：退化回均匀随机
      return pickUniformIndices(n);
    }

    const result = [];
    while (result.length < n && pool.length > 0) {
      const total = pool.reduce((s, x) => s + x.w, 0);
      let r = Math.random() * total;
      let idx = pool.length - 1;
      for (let j = 0; j < pool.length; j++) {
        r -= pool[j].w;
        if (r < 0) { idx = j; break; }
      }
      result.push(pool[idx].i);
      pool.splice(idx, 1);
    }

    // 若池中不足 n 种，则从剩余卡中均匀补充
    if (result.length < n) {
      const rest = [];
      for (let i = 0; i < futures.length; i++) {
        if (!result.includes(i)) rest.push(i);
      }
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      while (result.length < n && rest.length > 0) {
        result.push(rest.pop());
      }
    }

    return result;
  }

  function pickUniformIndices(n) {
    const arr = Array.from({ length: futures.length }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.slice(0, n);
  }

  function renderFutures(indices, animate = true) {
    if (futureGrid.childElementCount > 0) return;
    futureGrid.innerHTML = '';

    indices.forEach((idx, i) => {
      const item = futures[idx];
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'future-card';
      card.dataset.idx = idx;
      if (animate) card.style.setProperty('--d', `${i * 190}ms`);

      const titleEl = document.createElement('span');
      titleEl.className = 'future-title';
      titleEl.textContent = item.title;

      const textEl = document.createElement('span');
      textEl.className = 'future-text';
      textEl.textContent = item.text;

      card.appendChild(titleEl);
      card.appendChild(textEl);
      card.addEventListener('click', () => chooseFuture(card, idx));
      futureGrid.appendChild(card);
    });

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        futureGrid.querySelectorAll('.future-card').forEach((c) => c.classList.add('shown'));
      });
    });
  }

  function chooseFuture(card, idx) {
    if (futureChosen) return;
    futureChosen = true;
    chosenFutureIdx = idx;

    futureGrid.querySelectorAll('.future-card').forEach((c) => {
      if (c === card) c.classList.add('locked');
      else c.classList.add('dimmed');
    });

    saveState();
    setTimeout(() => {
      revealBox(4);
      saveState();
    }, 320);
  }

  /* ==================== Box 4：记账 ==================== */
  const FOOD_EMOJIS = ['🍕','🍔','🌮','🍜','🍣','🍩','🍦','🥗','🍗','🍟',
                       '🍱','🍝','🍫','🍎','🥪','🍤','🧁','🍙','🥟','🍇'];

  function dropFoodEmoji() {
    const svg = avatarCol.querySelector('.avatar');
    if (!svg) return;

    const colRect = avatarCol.getBoundingClientRect();
    const svgRect = svg.getBoundingClientRect();
    if (!svgRect.width || !svgRect.height) return;

    const cx = (svgRect.left - colRect.left) + svgRect.width  * (60 / 120);
    const cy = (svgRect.top  - colRect.top)  + svgRect.height * (166 / 180);

    const rx = svgRect.width  * 0.34;
    const ry = svgRect.height * 0.055;

    const existing = [];
    avatarCol.querySelectorAll('.food-anchor').forEach(a => {
      const x = parseFloat(a.style.left);
      const y = parseFloat(a.style.top);
      if (!isNaN(x) && !isNaN(y)) existing.push({ x, y });
    });

    const isFirstFour = existing.length < 4;
    const minDist = 30;
    const maxAttempts = 30;

    let px, py;
    let attempts = 0;

    do {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random());
      px = cx + Math.cos(ang) * rx * rad;
      py = cy + Math.sin(ang) * ry * rad;
      attempts++;

      if (!isFirstFour) break;
      if (!existing.some(p => {
        const dx = px - p.x;
        const dy = py - p.y;
        return Math.sqrt(dx * dx + dy * dy) < minDist;
      })) break;
    } while (attempts < maxAttempts);

    const anchor = document.createElement('span');
    anchor.className = 'food-anchor';
    anchor.style.left = `${px}px`;
    anchor.style.top  = `${py}px`;

    const span = document.createElement('span');
    span.className = 'dropped-food dropping';
    span.textContent = FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];

    span.style.setProperty('--rot', `${(Math.random() * 50 - 25).toFixed(1)}deg`);
    span.style.setProperty('--bounce-dur', `${(0.55 + Math.random() * 1.0).toFixed(2)}s`);
    span.style.setProperty('--bounce-delay', `${(Math.random() * 0.7).toFixed(2)}s`);
    span.style.setProperty('--bounce-x', `${(Math.random() * 16 - 8).toFixed(1)}px`);
    span.style.setProperty('--bounce-rot', `${(Math.random() * 30 - 15).toFixed(1)}deg`);

    span.addEventListener('animationiteration', (e) => {
      if (e.animationName !== 'food-bounce') return;
      span.style.setProperty('--bounce-x', `${(Math.random() * 16 - 8).toFixed(1)}px`);
      span.style.setProperty('--bounce-rot', `${(Math.random() * 30 - 15).toFixed(1)}deg`);
    });

    anchor.appendChild(span);
    avatarCol.appendChild(anchor);

    span.addEventListener('animationend', (e) => {
      if (e.animationName !== 'food-drop') return;
      if (!span.classList.contains('dropping')) return;
      span.classList.remove('dropping');
      span.classList.add('landed');
    }, { once: true });

    const all = avatarCol.querySelectorAll('.food-anchor');
    if (all.length > 16) {
      all[0].remove();
    }
  }

  function updateBudgetDisplay() {
    budgetValue.textContent = remaining.toFixed(2);
    document.body.classList.toggle('over-budget', remaining < 0);
    if (remaining >= 0) {
      document.body.classList.remove('wiping-tears');
    }
    pageTitleText.textContent = remaining < 0 ? '今天你又乱吃饭' : '今天密校吃什么';
  }

  function renderRecords() {
    recordsList.innerHTML = '';

    if (records.length === 0) {
      const li = document.createElement('li');
      li.className = 'records-empty';
      li.textContent = '快去吃饭吧';
      recordsList.appendChild(li);
      return;
    }

    records.forEach((r) => {
      const li = document.createElement('li');
      li.className = 'record-item';

      const top = document.createElement('div');
      top.className = 'record-top';

      const name = document.createElement('span');
      name.className = 'record-name';
      name.textContent = r.name;

      const price = document.createElement('span');
      price.className = 'record-price';
      price.textContent = `$${r.price.toFixed(2)}`;

      top.appendChild(name);
      top.appendChild(price);
      li.appendChild(top);

      if (r.note) {
        const note = document.createElement('div');
        note.className = 'record-note';
        note.textContent = r.note;
        li.appendChild(note);
      }

      recordsList.appendChild(li);
    });
  }

  menuBtn.addEventListener('click', () => {
    const open = recordsWrap.classList.toggle('open');
    menuBtn.classList.toggle('active', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  function markInvalid(el) {
    el.classList.remove('invalid');
    void el.offsetWidth;
    el.classList.add('invalid');
    el.focus();
    setTimeout(() => el.classList.remove('invalid'), 600);
  }

  addBtn.addEventListener('click', () => {
    const name = foodName.value.trim();
    const rawPrice = foodPrice.value.trim();
    const note = foodNote.value.trim();

    if (!name) { markInvalid(foodName); return; }

    const n = Number(rawPrice);
    if (rawPrice === '' || !Number.isFinite(n) || n <= 0) {
      markInvalid(foodPrice);
      return;
    }

    const price = Number(n.toFixed(2));

    records.push({ name, price, note });
    remaining = Number((remaining - price).toFixed(2));

    foodName.value = '';
    foodPrice.value = '';
    foodNote.value = '';

    updateBudgetDisplay();
    renderRecords();
    dropFoodEmoji();
    saveState();

    foodName.focus();
  });

  /* ==================== 收起 / 展开 ==================== */
  function isBox4Visible() {
    const box4 = document.getElementById('box4');
    return box4 && !box4.hidden;
  }

  function isAtBottom() {
    return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 5;
  }

  function updateCollapsedSummary() {
    summaryBudget.textContent = initialBudget > 0
      ? `$${initialBudget.toFixed(2)}`
      : '--';

    const lockedCard = cuisineCards.find(c => c.classList.contains('locked'));
    summaryCuisine.textContent = lockedCard
      ? lockedCard.querySelector('.cuisine-name').textContent
      : '--';

    if (chosenFutureIdx !== null && futures[chosenFutureIdx]) {
      summaryFuture.textContent = futures[chosenFutureIdx].title;
      summaryFuture.classList.add('clickable');
      summaryFuture.setAttribute('role', 'button');
      summaryFuture.setAttribute('tabindex', '0');
      summaryFuture.title = '点击查看这张彩蛋卡片的说明';
    } else {
      summaryFuture.textContent = '--';
      summaryFuture.classList.remove('clickable');
      summaryFuture.removeAttribute('role');
      summaryFuture.removeAttribute('tabindex');
      summaryFuture.removeAttribute('title');
    }
  }

  /* 折叠后点击彩蛋卡片名 → 小弹窗介绍 */
  function openFutureInfoModal() {
    if (chosenFutureIdx === null) return;
    const f = futures[chosenFutureIdx];
    if (!f) return;
    openModal('今日彩蛋卡片', `
      <h4>${f.title}</h4>
      <p>${f.text}</p>
      <p class="modal-hint">这是你今天抽到的限定规则，需要在今天的一日三餐中遵守它。</p>
    `);
  }

  summaryFuture.addEventListener('click', openFutureInfoModal);
  summaryFuture.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openFutureInfoModal();
    }
  });

  function collapseBoxes() {
    if (isCollapsed) return;
    if (!isBox4Visible()) return;
    isCollapsed = true;
    ['box1', 'box2', 'box3'].forEach(id => {
      document.getElementById(id).classList.add('collapsed');
    });
    updateCollapsedSummary();
    collapsedSummary.hidden = false;
    collapseBanner.hidden = false;
    atBottomOnce = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function expandBoxes() {
    if (!isCollapsed) return;
    isCollapsed = false;
    ['box1', 'box2', 'box3'].forEach(id => {
      document.getElementById(id).classList.remove('collapsed');
    });
    collapsedSummary.hidden = true;
    collapseBanner.hidden = true;
    atBottomOnce = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function handleDownIntent() {
    if (isCollapsed) return;
    if (!isBox4Visible()) return;
    if (isAtBottom()) {
      if (atBottomOnce) {
        collapseBoxes();
      } else {
        atBottomOnce = true;
      }
    } else {
      atBottomOnce = false;
    }
  }

  window.addEventListener('wheel', (e) => {
    if (e.deltaY > 0) {
      handleDownIntent();
    } else {
      atBottomOnce = false;
    }
  }, { passive: true });

  let touchStartY = 0;
  let touchAtBottomAtStart = false;

  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
    touchAtBottomAtStart = isAtBottom();
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (isCollapsed) return;
    if (!isBox4Visible()) return;
    const currentY = e.touches[0].clientY;
    const deltaY = touchStartY - currentY;
    if (deltaY > 20 && touchAtBottomAtStart) {
      collapseBoxes();
    }
    if (deltaY < -20) {
      touchAtBottomAtStart = false;
    }
  }, { passive: true });

  collapseBanner.addEventListener('click', expandBoxes);

  /* ==================== 弹窗基础 ==================== */
  function openModal(title, bodyHTML) {
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHTML;
    modalBackdrop.hidden = false;
  }

  function closeModal() {
    modalBackdrop.hidden = true;
    modalBody.innerHTML = '';
    modalBody.onclick = null;
  }

  modalCloseBtn.addEventListener('click', closeModal);

  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modalBackdrop.hidden) closeModal();
  });

  /* ==================== 修改名称弹窗 ==================== */
  function openNameModal() {
    openModal('修改名称', `
      <div class="form-group">
        <label class="form-label">你的名称</label>
        <input class="form-input" id="nameInput" type="text" maxlength="20" placeholder="请输入名称">
      </div>
      <div class="form-actions">
        <button class="btn-secondary" id="nameCancelBtn" type="button">取消</button>
        <button class="btn-primary" id="nameSaveBtn" type="button">保存</button>
      </div>
    `);

    const input = document.getElementById('nameInput');
    input.value = userName;

    document.getElementById('nameCancelBtn').onclick = closeModal;
    document.getElementById('nameSaveBtn').onclick = () => {
      const v = input.value.trim();
      if (v) {
        userName = v;
        saveUserName(v);
        userNameEl.textContent = v;
      }
      closeModal();
    };

    setTimeout(() => { input.focus(); input.select(); }, 80);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('nameSaveBtn').click();
      }
    });
  }

  userNameEl.addEventListener('click', openNameModal);
  userNameEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openNameModal();
    }
  });

  /* ==================== 规则弹窗 ==================== */
  function openRulesModal() {
    let html = '';
    html += `<h4>玩法说明</h4>`;
    html += `<p>1. 点击「投掷」获得今日经费（6 个骰子点数之和）。周五、周六、周日会额外获得 10 美元津贴。</p>`;
    html += `<p>2. 选择你愿意接受的菜系，点击「开始随机」抽取最终菜系。</p>`;
    html += `<p>3. 从 3 张命运卡片中选择一张作为今日限定规则。</p>`;
    html += `<p>4. 在记账区记录每一笔花销，超出经费后页面会变红，小人也会掉眼泪。</p>`;
    html += `<p>5. 记账区出现后，一路向下滑动到页面底部，再继续向下滑一下，上方内容就会自动折叠成一条汇总条；点击「展开上方内容」即可恢复。折叠之后，点击汇总条里的彩蛋卡片名字，可以再次查看这张卡片的说明。</p>`;
    html += `<h4>全部命运卡片（${futures.length} 张）</h4>`;
    html += `<div class="rules-list">`;
    futures.forEach((f) => {
      html += `
        <div class="rule-card">
          <div class="rule-title">${f.title}</div>
          <div class="rule-text">${f.text}</div>
        </div>
      `;
    });
    html += `</div>`;
    openModal('规则', html);
  }

  rulesBtn.addEventListener('click', openRulesModal);

  /* ==================== 设置弹窗 ==================== */
  function openSettingsModal() {
    let html = '';
    html += `<div class="settings-intro">调整每张命运卡片在抽取池中的份数（0–9）。份数为 0 的卡片不会被抽中；份数越多，被抽中的概率越高。</div>`;
    html += `<div class="settings-list">`;
    futures.forEach((f, i) => {
      const w = futureWeights[i];
      html += `
        <div class="weight-row">
          <div class="weight-info">
            <button class="weight-title" type="button" data-idx="${i}">
              <span class="weight-title-text">${f.title}</span>
            </button>
            <div class="weight-desc" data-idx="${i}">${f.text}</div>
          </div>
          <div class="weight-control">
            <button class="weight-btn" type="button" data-idx="${i}" data-delta="-1" aria-label="减少"${w <= 0 ? ' disabled' : ''}>−</button>
            <span class="weight-count" data-idx="${i}">${w}</span>
            <button class="weight-btn" type="button" data-idx="${i}" data-delta="1" aria-label="增加"${w >= 9 ? ' disabled' : ''}>+</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    html += `
      <div class="settings-footer">
        <button class="restart-btn" type="button" id="restartBtn">重新开始今日</button>
      </div>
    `;
    openModal('设置', html);
    bindSettingsHandlers();
  }

  function bindSettingsHandlers() {
    const body = modalBody;

    /* 用 onclick 覆盖式绑定，避免重复打开设置时监听器累积导致一次点击加减多次 */
    body.onclick = (e) => {
      const btn = e.target.closest('.weight-btn');
      if (btn) {
        e.stopPropagation();
        if (btn.disabled) return;

        const idx = Number(btn.dataset.idx);
        const delta = Number(btn.dataset.delta);
        const cur = futureWeights[idx];
        const next = delta < 0 ? cur - 1 : cur + 1;

        if (next < 0 || next > 9) return;

        futureWeights[idx] = next;

        const countEl = body.querySelector(`.weight-count[data-idx="${idx}"]`);
        if (countEl) countEl.textContent = next;

        const minusBtn = body.querySelector(`.weight-btn[data-idx="${idx}"][data-delta="-1"]`);
        const plusBtn  = body.querySelector(`.weight-btn[data-idx="${idx}"][data-delta="1"]`);
        if (minusBtn) minusBtn.disabled = next <= 0;
        if (plusBtn)  plusBtn.disabled  = next >= 9;

        saveWeights();
        return;
      }

      const title = e.target.closest('.weight-title');
      if (title) {
        e.stopPropagation();
        const idx = Number(title.dataset.idx);
        const descs = body.querySelectorAll('.weight-desc');
        const target = descs[idx];
        const wasOpen = target && target.classList.contains('shown');
        descs.forEach(d => d.classList.remove('shown'));
        if (target && !wasOpen) {
          target.classList.add('shown');
        }
        return;
      }

      if (!e.target.closest('.weight-desc')) {
        body.querySelectorAll('.weight-desc').forEach(d => d.classList.remove('shown'));
      }
    };

    const restartBtn = document.getElementById('restartBtn');
    if (restartBtn) {
      restartBtn.onclick = () => {
        closeModal();
        resetAll();
      };
    }
  }

  settingsBtn.addEventListener('click', openSettingsModal);

  /* ==================== 全部重置（跨天 / 重新开始） ==================== */
  function resetAll() {
    if (mealTimer) { clearInterval(mealTimer); mealTimer = null; }
    if (moodTimer) { clearInterval(moodTimer); moodTimer = null; }
    if (randomTimer) { clearTimeout(randomTimer); randomTimer = null; }

    hasRolled = false;
    isRolling = false;
    diceTotal = 0;
    initialBudget = 0;
    remaining = 0;
    lastBubbleMessage = '';
    chosenMoodIdx = null;
    isAnimating = false;
    isFinished = false;
    futurePicksIdx = [];
    chosenFutureIdx = null;
    futureChosen = false;
    isCollapsed = false;
    atBottomOnce = false;
    records.length = 0;

    document.body.classList.remove('wiping-tears');

    dice.forEach(die => {
      setDieValue(die.querySelector('.die-value'), 6);
      die.classList.remove('rolling', 'pop');
    });

    rollBtn.disabled = false;
    rollBtn.classList.remove('used');

    resetBubbles();

    cuisineCards.forEach(c => {
      c.classList.remove('selected', 'locked', 'dimmed', 'flash');
      c.setAttribute('aria-pressed', 'false');
      c.style.pointerEvents = '';
    });
    cuisineGrid.classList.remove('randomizing');
    randomWrap.classList.remove('gone');
    randomBtn.disabled = true;

    futureGrid.innerHTML = '';

    recordsList.innerHTML = '';
    foodName.value = '';
    foodPrice.value = '';
    foodNote.value = '';
    recordsWrap.classList.remove('open');
    menuBtn.classList.remove('active');
    menuBtn.setAttribute('aria-expanded', 'false');

    avatarCol.querySelectorAll('.food-anchor').forEach(a => a.remove());

    ['box2', 'box3', 'box4'].forEach(id => {
      const box = document.getElementById(id);
      box.hidden = true;
      box.classList.remove('reveal-in');
    });
    ['box1', 'box2', 'box3'].forEach(id => {
      document.getElementById(id).classList.remove('collapsed');
    });

    collapsedSummary.hidden = true;
    collapseBanner.hidden = true;

    updateBudgetDisplay();
    renderRecords();

    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}

    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function checkDateChange() {
    const now = todayStr();
    if (now !== currentDate) {
      currentDate = now;
      resetAll();
    }
  }

  setInterval(checkDateChange, 30000);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkDateChange();
  });

  window.addEventListener('focus', checkDateChange);

  /* ==================== 本地状态 ==================== */
  function saveState() {
    const diceValues = hasRolled
      ? dice.map((d) => Number(d.querySelector('.die-value').textContent))
      : [];

    const lockedIdx = cuisineCards.findIndex((c) => c.classList.contains('locked'));

    const state = {
      date: todayStr(),
      rolled: hasRolled,
      diceValues,
      total: diceTotal,
      budget: initialBudget,
      remaining,
      bubbleMessage: lastBubbleMessage,
      records,
      box2Visible: !document.getElementById('box2').hidden,
      cuisineSelected: cuisineCards
        .map((c, i) => (c.classList.contains('selected') ? i : -1))
        .filter((i) => i >= 0),
      cuisineLocked: lockedIdx >= 0 ? lockedIdx : null,
      box3Visible: !document.getElementById('box3').hidden,
      futurePicks: futurePicksIdx,
      futureChosen: chosenFutureIdx,
      box4Visible: !document.getElementById('box4').hidden,
      moodChosen: chosenMoodIdx
    };

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.date !== todayStr()) {
        localStorage.removeItem(STORAGE_KEY);
        return null;
      }
      return s;
    } catch (e) {
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }
  }

  function restoreState(s) {
    if (s.rolled) {
      if (Array.isArray(s.diceValues) && s.diceValues.length === DICE_COUNT) {
        s.diceValues.forEach((v, i) => {
          if (dice[i]) setDieValue(dice[i].querySelector('.die-value'), v);
        });
      }

      hasRolled = true;
      rollBtn.disabled = true;
      rollBtn.classList.add('used');

      diceTotal = s.total || 0;
      initialBudget = s.budget || 0;
      remaining = typeof s.remaining === 'number' ? s.remaining : initialBudget;
      lastBubbleMessage = s.bubbleMessage || '';

      updateBudgetDisplay();

      if (Array.isArray(s.records)) {
        records.length = 0;
        records.push(...s.records);
      }
      renderRecords();

      if (lastBubbleMessage) {
        bubbleText.textContent = lastBubbleMessage;
      }
      bubbleWrap.classList.add('open');
      responseWrap.classList.add('open');

      if (s.moodChosen !== null && s.moodChosen !== undefined) {
        chosenMoodIdx = s.moodChosen;
        responseArea.classList.add('mood-mode');
        moodText.textContent = moods[s.moodChosen].text;
      }
    }

    if (s.box2Visible) {
      if (Array.isArray(s.cuisineSelected)) {
        s.cuisineSelected.forEach((i) => {
          if (cuisineCards[i]) {
            cuisineCards[i].classList.add('selected');
            cuisineCards[i].setAttribute('aria-pressed', 'true');
          }
        });
      }

      if (s.cuisineLocked !== null && s.cuisineLocked !== undefined) {
        isFinished = true;
        cuisineCards.forEach((c, i) => {
          if (i === s.cuisineLocked) c.classList.add('locked');
          else c.classList.add('dimmed');
          c.style.pointerEvents = 'none';
        });
        randomWrap.classList.add('gone');
      } else {
        updateRandomBtn();
      }

      revealBox(2, false);
    }

    if (s.box3Visible && Array.isArray(s.futurePicks) && s.futurePicks.length) {
      futurePicksIdx = s.futurePicks.slice();
      renderFutures(futurePicksIdx, true);

      if (s.futureChosen !== null && s.futureChosen !== undefined) {
        chosenFutureIdx = s.futureChosen;
        futureChosen = true;
        futureGrid.querySelectorAll('.future-card').forEach((c) => {
          if (Number(c.dataset.idx) === s.futureChosen) c.classList.add('locked');
          else c.classList.add('dimmed');
        });
      }

      revealBox(3, false);
    }

    if (s.box4Visible) {
      revealBox(4, false);
    }
  }

  /* ==================== 初始化 ==================== */
  (function init() {
    currentDate = todayStr();

    // 跨天保留：名称 / 权重
    userName = loadUserName();
    userNameEl.textContent = userName;

    futureWeights = loadWeights();

    const saved = loadState();
    if (saved) {
      restoreState(saved);
    } else {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      updateBudgetDisplay();
      renderRecords();
    }
  })();
</script>

</body>
</html>
