<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天密校吃什么</title>
<style>
  :root{
    --um-blue: #00274C;
    --um-maize: #FFCB05;
    --bg: var(--um-blue);
    --box-bg: #001a33;
    --box-border: #0a3a63;
    --text: #eaf1f8;
    --meal-brown: #9A3324;
    --cool-white: 226, 238, 255;
    --gap: 28px;
    --box-pad: 26px;
  }
  *{ box-sizing: border-box; }
  html{ height: 100%; }
  body{
    min-height: 100%;
    margin: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #0a3a63 0%, var(--bg) 62%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 82px 16px 56px;
    transition: background .6s ease;
  }

  body.over-budget{
    background:
      radial-gradient(1200px 600px at 50% -10%, #4a1810 0%, #250a06 62%),
      #250a06;
  }

  .stack{
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ========== 顶部横幅（全宽固定，无圆角，囊括 ID + 规则 + 设置） ========== */
  .banner{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 900;
    border-radius: 0;
    border: none;
    border-bottom: 1px solid var(--box-border);
    background: var(--box-bg);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      0 4px 14px rgba(0, 0, 0, .24);
    transition: background .5s ease, border-color .5s ease;
  }
  body.over-budget .banner{
    border-bottom-color: rgba(180, 80, 60, .40);
    background: #2a0f0a;
  }

  .top-bar{
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
  }

  .user-id{
    font-size: 14px;
    font-weight: 700;
    color: rgba(234, 241, 248, .88);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 60%;
    text-decoration: underline transparent;
    text-underline-offset: 3px;
    transition: background .2s ease, color .5s ease, text-decoration-color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .user-id:hover{
    background: rgba(226, 238, 255, .08);
    text-decoration-color: currentColor;
  }
  body.over-budget .user-id{ color: #ff9b7d; }

  .top-buttons{
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .top-btn{
    appearance: none;
    padding: 7px 16px;
    border-radius: 10px;
    border: 1px solid var(--box-border);
    background: var(--box-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, color .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .top-btn:hover{
    background: #002a4a;
    border-color: #0f4a7a;
  }
  body.over-budget .top-btn{
    border-color: rgba(180, 80, 60, .4);
    background: #2a0f0a;
    color: #ff9b7d;
  }
  body.over-budget .top-btn:hover{
    background: #3a1610;
    border-color: rgba(200, 100, 80, .55);
  }

  /* ---------- 标题 ---------- */
  .title-wrap{
    width: 80%;
    margin: 12px auto 4px;
    background: transparent;
    display: flex;
    justify-content: center;
  }

  .page-title{
    margin: 0;
    font-size: clamp(24px, 6.2vw, 38px);
    font-weight: 900;
    line-height: 1.35;
    color: var(--um-maize);
    text-align: center;
    text-shadow:
      0 0 26px rgba(255, 203, 5, .32),
      0 2px 0 rgba(0, 0, 0, .28);
    transition: color .5s ease, text-shadow .5s ease;
  }
  .page-title span{
    display: inline-block;
    letter-spacing: .24em;
    padding-left: .24em;
  }

  body.over-budget .page-title{
    color: #ff9b7d;
    text-shadow:
      0 0 26px rgba(255, 120, 90, .42),
      0 2px 0 rgba(0, 0, 0, .35);
  }

  /* ---------- 收起汇总容器 ---------- */
  .collapsed-summary{
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--box-border);
    background: var(--box-bg);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      inset 0 5px 16px rgba(0, 0, 0, .44),
      0 4px 14px rgba(0, 0, 0, .24);
    transition: background .5s ease, border-color .5s ease;
  }
  .collapsed-summary[hidden]{ display: none; }

  .summary-item{
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .summary-label{
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .5px;
    color: rgba(200, 214, 230, .72);
    white-space: nowrap;
    transition: color .5s ease;
  }

  .summary-value{
    font-size: 13.5px;
    font-weight: 800;
    color: var(--um-maize);
    line-height: 1.4;
    overflow-wrap: anywhere;
    transition: color .5s ease, text-decoration-color .2s ease;
  }

  /* 可点击的彩蛋卡片名 */
  .summary-value.clickable{
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    text-decoration-color: rgba(255, 203, 5, .42);
    -webkit-tap-highlight-color: transparent;
  }
  .summary-value.clickable:hover{
    text-decoration-color: currentColor;
  }

  body.over-budget .collapsed-summary{
    border-color: rgba(180, 80, 60, .40);
    background: #2a0f0a;
  }
  body.over-budget .summary-label{ color: rgba(255, 150, 130, .85); }
  body.over-budget .summary-value{ color: #ff9b7d; }
  body.over-budget .summary-value.clickable{
    text-decoration-color: rgba(255, 155, 125, .42);
  }
  body.over-budget .summary-value.clickable:hover{
    text-decoration-color: currentColor;
  }

  /* ---------- 收起横幅 ---------- */
  .collapse-banner{
    width: 100%;
    padding: 15px 20px;
    border-radius: 16px;
    border: 1px solid var(--box-border);
    background: var(--box-bg);
    color: var(--um-maize);
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      inset 0 5px 16px rgba(0, 0, 0, .44),
      0 4px 14px rgba(0, 0, 0, .24);
    transition: background .5s ease, border-color .5s ease, color .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .collapse-banner:hover{
    background: #002a4a;
    border-color: #0f4a7a;
  }
  body.over-budget .collapse-banner{
    border-color: rgba(180, 80, 60, .40);
    background: #2a0f0a;
    color: #ff9b7d;
  }
  body.over-budget .collapse-banner:hover{
    background: #3a1610;
    border-color: rgba(200, 100, 80, .55);
  }
  .collapse-banner[hidden]{ display: none; }

  .box.collapsed{ display: none !important; }

  /* ---------- 通用 box ---------- */
  .box{
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 20px;
    padding: var(--box-pad) 18px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    flex-shrink: 0;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      inset 0 5px 16px rgba(0, 0, 0, .44),
      inset 0 -4px 12px rgba(0, 0, 0, .30),
      inset 4px 0 10px rgba(0, 0, 0, .18),
      inset -4px 0 10px rgba(0, 0, 0, .18),
      0 4px 14px rgba(0, 0, 0, .24);
    transition: border-color .5s ease, background .5s ease;
  }

  body.over-budget .box{
    border-color: rgba(180, 80, 60, .40);
    background: #2a0f0a;
  }

  .box[hidden]{ display: none; }
  .box.reveal-in{
    animation: box-in .6s cubic-bezier(.3, 1, .4, 1) both;
  }
  @keyframes box-in{
    from{ opacity: 0; transform: translateY(-16px) scale(.97); }
    to  { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- 6 个骰子 ---------- */
  .dice-grid{
    width: 100%;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    justify-items: center;
    margin-bottom: var(--gap);
    padding-right: 16px;
    flex: 0 0 auto;
  }

  .die{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 74px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .55));
    transform-origin: center;
    transition: transform .18s ease;
  }
  .die.rolling{ transform: scale(.96) rotate(-1deg); }
  .die.pop{ animation: pop .32s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.1); }
    100%{ transform: scale(1); }
  }

  .die-shape{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .die-shape polygon{
    stroke: rgba(255,203,5,.20);
    stroke-width: 1.2;
    stroke-linejoin: round;
  }
  .face-front{ fill: #0b3a63; }
  .face-top{ fill: #12507f; }
  .face-side{ fill: #072a4a; }

  .die-value{
    position: absolute;
    left: 50%;
    top: 65%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--um-maize);
    text-shadow: 0 0 12px rgba(255, 203, 5, .30);
    user-select: none;
    pointer-events: none;
    line-height: 1;
    transition: color .15s ease;
  }

  /* ---------- 金属按钮 ---------- */
  .roll-btn,
  .random-btn,
  .add-btn{
    position: relative;
    isolation: isolate;
    overflow: hidden;
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 15px 46px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--um-blue);
    background: linear-gradient(135deg,
      #fffdf0 0%,
      #fff4b8 12%,
      #ffe97a 30%,
      #ffcb05 52%,
      #d9a400 76%,
      #9e7200 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.90),
      inset 0 -2px 6px rgba(90,60,0,.50),
      inset 0 0 0 1px rgba(255,236,150,.55),
      0 6px 18px rgba(255,203,5,.28);
    transition:
      transform .12s ease,
      box-shadow .2s ease,
      background .25s ease,
      color .25s ease;
    flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent;
  }

  .roll-btn::after,
  .random-btn::after,
  .add-btn::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      circle at var(--mx, 30%) var(--my, 30%),
      rgba(255,255,255,.90) 0%,
      rgba(255,255,255,.48) 18%,
      rgba(255,245,200,.20) 38%,
      rgba(255,255,255,0) 62%);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: screen;
  }
  .roll-btn:hover::after,
  .random-btn:hover::after,
  .add-btn:hover::after{ opacity: 1; }
  .roll-btn:not(:hover)::after,
  .random-btn:not(:hover)::after,
  .add-btn:not(:hover)::after{ transition: opacity .14s ease; }

  .btn-label{ position: relative; z-index: 1; }

  .roll-btn:hover,
  .random-btn:hover,
  .add-btn:hover{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -2px 6px rgba(90,60,0,.55),
      inset 0 0 0 1px rgba(255,240,170,.70),
      0 8px 22px rgba(255,203,5,.34);
  }
  .roll-btn:active,
  .random-btn:active,
  .add-btn:active{
    transform: translateY(1px) scale(.985);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.80),
      inset 0 -1px 3px rgba(90,60,0,.55),
      0 3px 10px rgba(255,203,5,.24);
  }

  .roll-btn:disabled,
  .roll-btn.used,
  .random-btn:disabled{
    cursor: default;
    pointer-events: none;
    color: #8b95a5;
    background: linear-gradient(135deg, #454f5e 0%, #2e3743 100%);
    box-shadow: none;
    transform: none;
  }
  .roll-btn:disabled::after,
  .roll-btn.used::after,
  .random-btn:disabled::after{ display: none; }

  /* ---------- 经费气泡 ---------- */
  .bubble-wrap{
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .38s cubic-bezier(.3, 1, .4, 1);
    flex: 0 0 auto;
  }
  .bubble-wrap.open{ grid-template-rows: 1fr; }
  .bubble-inner{ overflow: hidden; min-height: 0; }

  .bubble-row{
    width: 100%;
    display: flex;
    padding-top: var(--gap);
  }
  .bubble-row-left{
    justify-content: flex-start;
    padding-left: 10px;
  }

  .bubble{
    position: relative;
    display: inline-block;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.5;
    padding: 11px 18px;
    border-radius: 14px;
    max-width: 100%;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .bubble-left{
    background: linear-gradient(155deg, #b8473a 0%, #9A3324 52%, #742116 100%);
    color: #fff;
    text-shadow: 0 1px 2px rgba(50, 10, 5, .55);
    box-shadow:
      inset 0 1px 0 rgba(255, 220, 210, .32),
      inset 0 -2px 6px rgba(60, 12, 5, .42),
      0 6px 16px rgba(154, 51, 36, .34);
  }
  .bubble-left::before{
    content: "";
    position: absolute;
    left: -7px;
    top: 50%;
    transform: translateY(-50%);
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-right: 8px solid #9A3324;
  }

  .bubble-right{
    background: var(--um-maize);
    color: var(--um-blue);
    box-shadow: 0 6px 16px rgba(255, 203, 5, .22);
  }
  .bubble-right::before{
    content: "";
    position: absolute;
    right: -7px;
    top: 50%;
    transform: translateY(-50%);
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 8px solid var(--um-maize);
  }

  .caret{
    display: none;
    width: 2px;
    height: 1em;
    background: currentColor;
    margin-left: 3px;
    vertical-align: -.15em;
    animation: blink .9s steps(1) infinite;
    opacity: .85;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  /* ---------- 响应区 ---------- */
  .response-wrap{
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .38s cubic-bezier(.3, 1, .4, 1);
    flex: 0 0 auto;
  }
  .response-wrap.open{ grid-template-rows: 1fr; }
  .response-inner{ overflow: hidden; min-height: 0; width: 100%; }

  .response-area{
    width: 100%;
    display: grid;
    align-items: end;
  }

  .emoji-layer,
  .mood-layer{
    grid-area: 1 / 1;
    width: 100%;
    transition: opacity .3s ease, visibility .3s ease;
  }

  .emoji-layer{
    align-self: end;
    opacity: 1;
    visibility: visible;
  }

  .mood-layer{
    align-self: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .response-area.mood-mode .emoji-layer{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .response-area.mood-mode .mood-layer{
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .emoji-row{
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    padding: var(--gap) 24px 0;
  }

  .emoji-bubble{
    position: relative;
    isolation: isolate;
    overflow: hidden;
    width: 54px;
    height: 54px;
    border-radius: 16px;
    border: 1px solid rgba(var(--cool-white), .38);
    cursor: pointer;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: rgba(var(--cool-white), .16);
    color: var(--text);
    backdrop-filter: blur(10px) saturate(130%);
    -webkit-backdrop-filter: blur(10px) saturate(130%);
    box-shadow:
      0 4px 14px rgba(150, 185, 225, .18),
      inset 0 1px 0 rgba(255, 255, 255, .28);
    transition:
      transform .28s cubic-bezier(.2, .9, .3, 1.2),
      background .28s ease,
      border-color .28s ease,
      box-shadow .28s ease;
  }

  .emoji-bubble::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(var(--cool-white), .62) 0%,
      rgba(var(--cool-white), .26) 34%,
      rgba(var(--cool-white), .06) 58%,
      rgba(var(--cool-white), 0) 76%
    );
    opacity: 0;
    transition: opacity .22s ease;
    pointer-events: none;
    z-index: 0;
  }

  .emoji-glyph{ position: relative; z-index: 1; }

  .emoji-bubble:hover{
    transform: scale(1.07);
    background: rgba(var(--cool-white), .22);
    border-color: rgba(var(--cool-white), .70);
    box-shadow:
      inset 0 0 18px rgba(var(--cool-white), .38),
      inset 0 1px 0 rgba(255, 255, 255, .50);
  }

  .emoji-bubble:hover::after{ opacity: 1; }
  .emoji-bubble:not(:hover)::after{ transition: opacity .12s ease; }
  .emoji-bubble:active{ transform: scale(.96); }

  .response-wrap.open .emoji-bubble{
    animation: emoji-pop .4s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  .response-wrap.open .emoji-bubble:nth-child(1){ animation-delay: .02s; }
  .response-wrap.open .emoji-bubble:nth-child(2){ animation-delay: .09s; }
  .response-wrap.open .emoji-bubble:nth-child(3){ animation-delay: .16s; }
  .response-wrap.open .emoji-bubble:nth-child(4){ animation-delay: .23s; }

  @keyframes emoji-pop{
    0%{ opacity: 0; transform: scale(.4) translateY(6px); }
    100%{ opacity: 1; transform: scale(1) translateY(0); }
  }

  .mood-row{
    width: 100%;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: var(--gap) 20px 0;
  }

  /* ==================== Box 2：菜系卡片 ==================== */
  .cuisine-grid{
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }

  .cuisine-card{
    position: relative;
    isolation: isolate;
    overflow: hidden;
    appearance: none;
    cursor: pointer;
    border: 1px solid rgba(176, 200, 235, .30);
    border-radius: 14px;
    padding: 18px 6px;
    min-height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(155deg,
        rgba(132, 158, 196, .22) 0%,
        rgba(52, 70, 96, .30) 55%,
        rgba(28, 42, 62, .36) 100%);
    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: .5px;
    text-align: center;
    backdrop-filter: blur(9px) saturate(125%);
    -webkit-backdrop-filter: blur(9px) saturate(125%);
    box-shadow:
      0 4px 14px rgba(0, 0, 0, .34),
      inset 0 1px 0 rgba(226, 238, 255, .20),
      inset 0 -1px 0 rgba(0, 0, 0, .22);
    transition:
      transform .26s cubic-bezier(.2, .9, .3, 1.2),
      background .26s ease,
      border-color .26s ease,
      box-shadow .26s ease,
      color .26s ease,
      text-shadow .26s ease,
      opacity .35s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .cuisine-card::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(var(--cool-white), .50) 0%,
      rgba(var(--cool-white), .20) 34%,
      rgba(var(--cool-white), .04) 58%,
      rgba(var(--cool-white), 0) 76%
    );
    opacity: 0;
    transition: opacity .22s ease;
    pointer-events: none;
    z-index: 0;
  }

  .cuisine-name{ position: relative; z-index: 1; }

  .cuisine-card:not(.selected):not(.dimmed):not(.locked):hover{
    transform: translateY(-3px);
    background:
      linear-gradient(155deg,
        rgba(160, 188, 226, .30) 0%,
        rgba(70, 92, 122, .34) 55%,
        rgba(38, 56, 80, .40) 100%);
    border-color: rgba(196, 216, 245, .62);
    box-shadow:
      inset 0 0 20px rgba(var(--cool-white), .20),
      inset 0 1px 0 rgba(238, 246, 255, .34),
      0 8px 20px rgba(0, 0, 0, .38);
  }
  .cuisine-card:not(.dimmed):not(.locked):hover::after{ opacity: 1; }
  .cuisine-card:not(:hover)::after{ transition: opacity .12s ease; }
  .cuisine-card:not(.dimmed):not(.locked):active{ transform: translateY(-1px) scale(.97); }

  .cuisine-card.selected{
    color: var(--um-blue);
    text-shadow: none;
    border-color: rgba(255, 240, 170, .88);
    background:
      linear-gradient(135deg,
        #fffbe3 0%,
        #ffe97a 14%,
        #ffcb05 34%,
        #e0aa00 58%,
        #b88600 82%,
        #96690a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .85),
      inset 0 -2px 5px rgba(90, 60, 0, .42),
      inset 0 0 0 1px rgba(255, 236, 150, .55),
      0 6px 18px rgba(255, 203, 5, .32);
  }

  .cuisine-card.selected::after{
    mix-blend-mode: screen;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(255, 255, 255, .85) 0%,
      rgba(255, 250, 220, .45) 26%,
      rgba(255, 245, 200, .12) 52%,
      rgba(255, 255, 255, 0) 74%
    );
  }

  .cuisine-card.selected:not(.dimmed):not(.locked):hover{
    transform: translateY(-3px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .92),
      inset 0 -2px 5px rgba(90, 60, 0, .45),
      inset 0 0 0 1px rgba(255, 240, 170, .70),
      0 8px 22px rgba(255, 203, 5, .38);
  }
  .cuisine-card.selected:not(.dimmed):not(.locked):active{
    transform: translateY(-1px) scale(.97);
  }

  .cuisine-card.flash{
    transform: translateY(-4px) scale(1.05);
    border-color: #ffffff;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(70, 45, 0, .75);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .85),
      inset 0 0 30px rgba(255, 255, 255, .55),
      0 0 24px rgba(255, 220, 120, .70),
      0 8px 20px rgba(0, 0, 0, .35);
  }
  .cuisine-card.flash::after{
    opacity: 1;
    mix-blend-mode: screen;
    background: radial-gradient(
      circle at 50% 50%,
      rgba(255, 255, 255, .70) 0%,
      rgba(255, 250, 220, .38) 42%,
      rgba(255, 255, 255, 0) 78%
    );
  }

  .cuisine-card.locked{
    color: #ffffff;
    border-color: rgba(255, 168, 148, .75);
    text-shadow: 0 1px 2px rgba(50, 10, 5, .60);
    background:
      linear-gradient(155deg,
        #b8473a 0%,
        #9A3324 52%,
        #742116 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 220, 210, .38),
      inset 0 -2px 6px rgba(60, 12, 5, .48),
      inset 0 0 0 1px rgba(255, 170, 150, .30),
      0 6px 18px rgba(154, 51, 36, .38);
  }
  .cuisine-card.locked::after{
    mix-blend-mode: screen;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(255, 255, 255, .55) 0%,
      rgba(255, 226, 214, .24) 32%,
      rgba(255, 255, 255, 0) 72%
    );
  }

  .cuisine-card.dimmed{
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
    border-color: rgba(140, 152, 170, .20);
    background:
      linear-gradient(155deg,
        rgba(62, 72, 88, .26) 0%,
        rgba(34, 42, 54, .30) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      0 3px 10px rgba(0, 0, 0, .22);
    opacity: .74;
  }
  .cuisine-card.dimmed::after{ display: none; }
  .cuisine-card.dimmed:hover{
    transform: none;
    border-color: rgba(140, 152, 170, .20);
    background:
      linear-gradient(155deg,
        rgba(62, 72, 88, .26) 0%,
        rgba(34, 42, 54, .30) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      0 3px 10px rgba(0, 0, 0, .22);
  }

  .cuisine-grid.randomizing .cuisine-card:not(.dimmed){
    color: var(--um-blue);
    text-shadow:
      0 0 7px rgba(255, 255, 255, .60),
      0 1px 2px rgba(255, 255, 255, .30);
  }
  .cuisine-grid.randomizing .cuisine-card.flash:not(.dimmed){
    text-shadow: 0 1px 2px rgba(255, 255, 255, .45);
  }

  .random-wrap{
    width: 100%;
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .5s cubic-bezier(.3, 1, .4, 1);
  }
  .random-wrap.gone{ grid-template-rows: 0fr; }
  .random-inner{ overflow: hidden; min-height: 0; width: 100%; }
  .random-pad{
    display: flex;
    justify-content: center;
    padding-top: var(--gap);
  }

  /* ==================== Box 3：命运卡片 ==================== */
  .future-grid{
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .future-card{
    position: relative;
    isolation: isolate;
    appearance: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 9px;
    text-align: left;
    border: 1px solid rgba(176, 200, 235, .28);
    border-radius: 14px;
    padding: 16px 14px;
    min-height: 156px;
    font-family: inherit;
    background:
      linear-gradient(155deg,
        rgba(132, 158, 196, .20) 0%,
        rgba(52, 70, 96, .28) 55%,
        rgba(28, 42, 62, .34) 100%);
    color: #ffffff;
    box-shadow:
      0 4px 14px rgba(0, 0, 0, .34),
      inset 0 1px 0 rgba(226, 238, 255, .18),
      inset 0 -1px 0 rgba(0, 0, 0, .22);
    opacity: 0;
    filter: blur(10px);
    transform: scale(.94) translateY(10px);
    transition:
      background .35s ease,
      border-color .35s ease,
      box-shadow .35s ease,
      opacity .4s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .future-card.shown{
    animation: future-in .9s cubic-bezier(.2, .9, .3, 1.15) forwards;
    animation-delay: var(--d, 0ms);
  }

  @keyframes future-in{
    from{
      opacity: 0;
      filter: blur(10px);
      transform: scale(.94) translateY(10px);
    }
    to{
      opacity: 1;
      filter: blur(0);
      transform: scale(1) translateY(0);
    }
  }

  .future-title{
    position: relative;
    z-index: 1;
    font-size: 13.5px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: .5px;
    color: var(--um-maize);
    transition: color .3s ease;
  }

  .future-text{
    position: relative;
    z-index: 1;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.6;
    color: rgba(234, 241, 248, .88);
    transition: color .3s ease;
  }

  .future-card:not(.dimmed):not(.locked):hover{
    border-color: rgba(196, 216, 245, .62);
    background:
      linear-gradient(155deg,
        rgba(160, 188, 226, .28) 0%,
        rgba(70, 92, 122, .32) 55%,
        rgba(38, 56, 80, .38) 100%);
    box-shadow:
      inset 0 0 22px rgba(var(--cool-white), .16),
      inset 0 1px 0 rgba(238, 246, 255, .30),
      0 8px 20px rgba(0, 0, 0, .38);
  }

  .future-card.locked{
    border-color: rgba(255, 168, 148, .75);
    background:
      linear-gradient(155deg,
        #b8473a 0%,
        #9A3324 52%,
        #742116 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 220, 210, .38),
      inset 0 -2px 6px rgba(60, 12, 5, .48),
      inset 0 0 0 1px rgba(255, 170, 150, .30),
      0 6px 18px rgba(154, 51, 36, .40);
  }
  .future-card.locked .future-title{
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(50, 10, 5, .55);
  }
  .future-card.locked .future-text{
    color: rgba(255, 240, 236, .94);
  }

  .future-card.dimmed{
    cursor: default;
    pointer-events: none;
    border-color: rgba(140, 152, 170, .18);
    background:
      linear-gradient(155deg,
        rgba(58, 68, 84, .22) 0%,
        rgba(32, 40, 52, .26) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .04),
      0 2px 8px rgba(0, 0, 0, .18);
    opacity: .48;
  }
  .future-card.dimmed .future-title{
    color: rgba(168, 180, 196, .68);
  }
  .future-card.dimmed .future-text{
    color: rgba(158, 170, 186, .60);
  }

  /* ==================== Box 4：记账 ==================== */
  .budget-panel{
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 18px;
    align-items: stretch;
  }

  .avatar-col{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    min-height: 200px;
    align-self: start;
  }
  .avatar-col::before{
    content: "";
    position: absolute;
    width: 92%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 203, 5, .16) 0%,
      rgba(255, 203, 5, .05) 45%,
      rgba(255, 203, 5, 0) 72%);
    pointer-events: none;
  }

  .avatar{
    position: relative;
    width: 76%;
    max-width: 104px;
    height: auto;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .42));
    transform-origin: 50% 96%;
    animation: dance-sway 4.2s ease-in-out infinite;
    animation-play-state: paused;
  }
  .avatar-col:hover .avatar{
    animation-play-state: running;
  }

  @keyframes dance-sway{
    0%, 100%{ transform: rotate(0deg) translateY(0); }
    25%     { transform: rotate(-4deg) translateY(-3px); }
    50%     { transform: rotate(0deg) translateY(-1px); }
    75%     { transform: rotate(4deg) translateY(-3px); }
  }

  .avatar-arm{
    transform-box: view-box;
    animation: arm-swing-l 4.2s ease-in-out infinite;
    animation-play-state: paused;
  }
  .arm-left{ transform-origin: 47px 88px; }
  .arm-right{
    transform-origin: 73px 88px;
    animation-name: arm-swing-r;
  }
  .avatar-col:hover .avatar-arm{
    animation-play-state: running;
  }

  @keyframes arm-swing-l{
    0%   { transform: rotate(25deg); }
    50%  { transform: rotate(-65deg); }
    100% { transform: rotate(25deg); }
  }
  @keyframes arm-swing-r{
    0%   { transform: rotate(65deg); }
    50%  { transform: rotate(-25deg); }
    100% { transform: rotate(65deg); }
  }

  .avatar-head{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: head-bob 4.2s ease-in-out infinite;
    animation-play-state: paused;
  }
  .avatar-col:hover .avatar-head{
    animation-play-state: running;
  }
  @keyframes head-bob{
    0%, 100%{ transform: rotate(0deg); }
    50%     { transform: rotate(2.5deg); }
  }

  .avatar-legs{
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: legs-dance 4.2s ease-in-out infinite;
    animation-play-state: paused;
  }
  .avatar-col:hover .avatar-legs{
    animation-play-state: running;
  }
  @keyframes legs-dance{
    0%, 100%{ transform: skewX(0deg); }
    50%     { transform: skewX(3deg); }
  }

  body.over-budget .avatar,
  body.over-budget .avatar-head,
  body.over-budget .avatar-legs{
    animation-duration: 2.4s;
  }

  /* 超支时：双臂不再挥动，自然下垂 */
  body.over-budget .avatar-arm{
    animation: none;
    transition: transform .5s cubic-bezier(.3, 1, .4, 1);
  }
  body.over-budget .arm-left{ transform: rotate(-107deg); }
  body.over-budget .arm-right{ transform: rotate(107deg); }

  /* 超支时：手里的哑铃消失 */
  body.over-budget .avatar-arm .dumbbell-held{ opacity: 0; }
  .dumbbell-held{ transition: opacity .25s ease; }

  /* 掉在地上的哑铃（和食物 emoji 一样弹跳） */
  .dumbbell-dropped{
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    transition: opacity .3s ease;
  }
  .dumbbell-dropped.db-left{ --db-rot: -9deg; }
  .dumbbell-dropped.db-right{ --db-rot: 9deg; }

  body.over-budget .dumbbell-dropped{
    opacity: 1;
    animation: dumbbell-bounce 1.05s ease-in-out infinite;
  }
  body.over-budget .dumbbell-dropped.db-right{
    animation-duration: 1.25s;
    animation-delay: -.45s;
  }

  @keyframes dumbbell-bounce{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(-12px) rotate(var(--db-rot, 8deg)); }
  }

  /* 超支时：笑脸变成向下弯的嘴 */
  .mouth-sad{ display: none; }
  body.over-budget .mouth-smile{ display: none; }
  body.over-budget .mouth-sad{ display: inline; }

  /* 眼泪（超支时显示） */
  .avatar-tear{
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }
  body.over-budget .avatar-tear{
    animation: tear-drop 1.6s ease-in infinite;
  }
  body.over-budget .tear-right{ animation-delay: .55s; }

  /* 抚摸小人的脸时暂时擦去眼泪 */
  body.over-budget.wiping-tears .avatar-tear{
    animation: none !important;
    opacity: 0 !important;
  }

  @keyframes tear-drop{
    0%{ opacity: 0; transform: translateY(0); }
    15%{ opacity: .95; }
    75%{ opacity: .75; transform: translateY(10px); }
    100%{ opacity: 0; transform: translateY(15px); }
  }

  /* 掉落的食物 emoji */
  .food-anchor{
    position: absolute;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 3;
  }

  .dropped-food{
    position: absolute;
    left: 0;
    top: 0;
    font-size: 26px;
    line-height: 1;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .45));
    transform: translate(-50%, -50%) rotate(0deg);
  }

  .dropped-food.dropping{
    animation: food-drop .85s cubic-bezier(.4, 0, .6, 1) forwards;
  }
  @keyframes food-drop{
    0%{
      opacity: 0;
      transform: translate(-50%, -50%) translateY(-170px) rotate(0deg);
    }
    12%{ opacity: 1; }
    82%{
      transform: translate(-50%, -50%) translateY(3px) rotate(var(--rot, 0deg));
    }
    100%{
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0) rotate(var(--rot, 0deg));
    }
  }

  .dropped-food.landed{
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  }

  .avatar-col:hover .dropped-food.landed{
    animation: food-bounce var(--bounce-dur, .9s) ease-in-out infinite;
    animation-delay: var(--bounce-delay, 0s);
  }
  @keyframes food-bounce{
    0%, 100%{
      transform: translate(-50%, -50%) translate(var(--bounce-x, 0px), 0) rotate(var(--rot, 0deg));
    }
    50%{
      transform: translate(-50%, -50%) translate(var(--bounce-x, 0px), -11px)
                 rotate(calc(var(--rot, 0deg) + var(--bounce-rot, 0deg)));
    }
  }

  .input-col{
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .budget-row{
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(176, 200, 235, .16);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .3px;
    color: rgba(234, 241, 248, .90);
  }

  .budget-label{ flex: 0 0 auto; white-space: nowrap; }

  .budget-value{
    flex: 0 0 auto;
    font-size: 16px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--um-maize);
    transition: color .3s ease;
  }

  body.over-budget .budget-value{ color: #ff8a7a; }

  .budget-unit{
    flex: 0 0 auto;
    white-space: nowrap;
    color: rgba(200, 214, 230, .72);
    font-weight: 600;
  }

  .menu-btn{
    appearance: none;
    margin-left: auto;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    border: 1px solid rgba(176, 200, 235, .28);
    background: rgba(226, 238, 255, .10);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5px;
    padding: 0;
    transition: background .2s ease, border-color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-btn span{
    display: block;
    width: 14px;
    height: 2px;
    border-radius: 2px;
    background: rgba(234, 241, 248, .78);
    transition: background .2s ease;
  }
  .menu-btn:hover{
    background: rgba(226, 238, 255, .18);
    border-color: rgba(196, 216, 245, .55);
  }
  .menu-btn.active{
    background: rgba(255, 203, 5, .18);
    border-color: rgba(255, 203, 5, .62);
  }
  .menu-btn.active span{ background: var(--um-maize); }

  .records-wrap{
    width: 100%;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .35s cubic-bezier(.3, 1, .4, 1);
  }
  .records-wrap.open{ grid-template-rows: 1fr; }
  .records-inner{ overflow: hidden; min-height: 0; }
  .records-pad{ padding-top: 2px; }

  .records-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 190px;
    overflow-y: auto;
  }

  .records-empty{
    font-size: 13px;
    font-weight: 600;
    color: rgba(168, 184, 202, .60);
    padding: 8px 2px;
    letter-spacing: .5px;
  }

  .record-item{
    background: rgba(226, 238, 255, .07);
    border: 1px solid rgba(176, 200, 235, .16);
    border-radius: 10px;
    padding: 8px 11px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .record-top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .record-name{
    font-size: 12.5px;
    font-weight: 700;
    color: rgba(240, 246, 252, .95);
    overflow-wrap: anywhere;
  }

  .record-price{
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--um-maize);
  }

  .record-note{
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.5;
    color: rgba(186, 200, 218, .74);
    overflow-wrap: anywhere;
  }

  .record-input,
  .record-textarea{
    width: 100%;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    background: rgba(226, 238, 255, .08);
    border: 1px solid rgba(176, 200, 235, .22);
    border-radius: 11px;
    padding: 10px 13px;
    outline: none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }

  .record-input::placeholder,
  .record-textarea::placeholder{
    color: rgba(178, 194, 212, .48);
    font-weight: 500;
  }

  .record-input:focus,
  .record-textarea:focus{
    border-color: rgba(255, 203, 5, .55);
    background: rgba(226, 238, 255, .12);
    box-shadow: 0 0 0 3px rgba(255, 203, 5, .12);
  }

  .record-textarea{
    min-height: 76px;
    resize: vertical;
    line-height: 1.55;
  }

  .record-input.invalid{
    animation: shake .42s ease;
    border-color: rgba(255, 120, 100, .80);
    background: rgba(255, 120, 100, .10);
    box-shadow: 0 0 0 3px rgba(255, 120, 100, .14);
  }

  @keyframes shake{
    0%, 100%{ transform: translateX(0); }
    18%{ transform: translateX(-5px); }
    38%{ transform: translateX(5px); }
    58%{ transform: translateX(-3px); }
    78%{ transform: translateX(3px); }
  }

  .add-btn{
    align-self: flex-end;
    padding: 11px 30px;
    font-size: 14px;
    margin-top: 2px;
  }

  /* ========== 弹窗 ========== */
  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: modal-in .22s ease both;
  }
  .modal-backdrop[hidden]{ display: none; }
  @keyframes modal-in{ from{ opacity: 0; } to{ opacity: 1; } }

  .modal{
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 20px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .06),
      0 20px 60px rgba(0, 0, 0, .55);
    animation: modal-slide-in .3s cubic-bezier(.3, 1, .4, 1) both;
    transition: background .5s ease, border-color .5s ease;
  }
  body.over-budget .modal{
    background: #2a0f0a;
    border-color: rgba(180, 80, 60, .40);
  }

  @keyframes modal-slide-in{
    from{ opacity: 0; transform: translateY(20px) scale(.96); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(176, 200, 235, .16);
    transition: border-color .5s ease;
  }
  body.over-budget .modal-header{ border-bottom-color: rgba(180, 80, 60, .30); }

  .modal-title{
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    color: var(--um-maize);
    letter-spacing: .5px;
    transition: color .5s ease;
  }
  body.over-budget .modal-title{ color: #ff9b7d; }

  .modal-close{
    appearance: none;
    background: transparent;
    border: none;
    color: rgba(234, 241, 248, .70);
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    padding: 0 6px;
    border-radius: 8px;
    transition: background .2s ease, color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close:hover{ background: rgba(255, 255, 255, .10); color: #fff; }

  .modal-body{
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }

  .modal-body h4{
    margin: 18px 0 10px;
    font-size: 14px;
    color: var(--um-maize);
    font-weight: 800;
    letter-spacing: .5px;
  }
  .modal-body h4:first-child{ margin-top: 0; }
  body.over-budget .modal-body h4{ color: #ff9b7d; }

  .modal-body p{ margin: 0 0 10px; }

  .modal-hint{
    margin-top: 14px !important;
    font-size: 12.5px;
    color: rgba(200, 214, 230, .72);
    line-height: 1.6;
  }
  body.over-budget .modal-hint{ color: rgba(255, 180, 170, .82); }

  /* 名称编辑 */
  .form-group{ margin-bottom: 14px; }
  .form-label{
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: rgba(200, 214, 230, .80);
    margin-bottom: 6px;
    letter-spacing: .5px;
    transition: color .5s ease;
  }
  body.over-budget .form-label{ color: rgba(255, 170, 155, .88); }

  .form-input{
    width: 100%;
    padding: 12px 14px;
    border-radius: 11px;
    border: 1px solid rgba(176, 200, 235, .25);
    background: rgba(226, 238, 255, .08);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .form-input:focus{
    border-color: rgba(255, 203, 5, .60);
    background: rgba(226, 238, 255, .12);
    box-shadow: 0 0 0 3px rgba(255, 203, 5, .14);
  }
  body.over-budget .form-input{
    border-color: rgba(180, 80, 60, .30);
    background: rgba(255, 155, 125, .06);
  }
  body.over-budget .form-input:focus{
    border-color: rgba(255, 155, 125, .60);
    box-shadow: 0 0 0 3px rgba(255, 155, 125, .14);
  }

  .form-actions{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-primary, .btn-secondary{
    appearance: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease, color .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary{
    background: linear-gradient(135deg, #fff4b8 0%, #ffcb05 52%, #d9a400 100%);
    color: var(--um-blue);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 14px rgba(255,203,5,.28);
  }
  .btn-primary:hover{
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 6px 18px rgba(255,203,5,.4);
  }
  .btn-primary:active{ transform: scale(.97); }
  .btn-secondary{
    background: rgba(226, 238, 255, .08);
    border-color: rgba(176, 200, 235, .28);
    color: var(--text);
  }
  .btn-secondary:hover{
    background: rgba(226, 238, 255, .14);
    border-color: rgba(196, 216, 245, .5);
  }
  .btn-secondary:active{ transform: scale(.97); }
  body.over-budget .btn-secondary{
    background: rgba(255, 155, 125, .08);
    border-color: rgba(180, 80, 60, .30);
    color: #ff9b7d;
  }
  body.over-budget .btn-secondary:hover{
    background: rgba(255, 155, 125, .16);
    border-color: rgba(200, 100, 80, .5);
  }

  /* 规则列表 */
  .rules-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .rule-card{
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(226, 238, 255, .06);
    border: 1px solid rgba(176, 200, 235, .14);
    transition: background .5s ease, border-color .5s ease;
  }
  body.over-budget .rule-card{
    background: rgba(255, 155, 125, .06);
    border-color: rgba(180, 80, 60, .20);
  }
  .rule-title{
    font-size: 13px;
    font-weight: 800;
    color: var(--um-maize);
    margin-bottom: 4px;
    transition: color .5s ease;
  }
  body.over-budget .rule-title{ color: #ff9b7d; }
  .rule-text{
    font-size: 12.5px;
    line-height: 1.55;
    color: rgba(220, 232, 245, .85);
    transition: color .5s ease;
  }
  body.over-budget .rule-text{ color: rgba(255, 210, 200, .85); }

  /* 设置 */
  .settings-intro{
    font-size: 12.5px;
    color: rgba(200, 214, 230, .75);
    margin-bottom: 14px;
    line-height: 1.6;
    transition: color .5s ease;
  }
  body.over-budget .settings-intro{ color: rgba(255, 180, 170, .82); }

  .settings-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .weight-row{
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 10px;
    align-items: start;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(226, 238, 255, .05);
    border: 1px solid rgba(176, 200, 235, .12);
    transition: background .5s ease, border-color .5s ease;
  }
  body.over-budget .weight-row{
    background: rgba(255, 155, 125, .06);
    border-color: rgba(180, 80, 60, .20);
  }

  .weight-info{ min-width: 0; }

  .weight-title{
    appearance: none;
    background: transparent;
    border: none;
    padding: 4px 0;
    text-align: left;
    color: var(--um-maize);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    width: 100%;
    transition: color .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  body.over-budget .weight-title{ color: #ff9b7d; }

  .weight-title-text{ flex: 1; overflow-wrap: anywhere; }

  .weight-desc{
    display: none;
    font-size: 12px;
    line-height: 1.55;
    color: rgba(200, 215, 232, .88);
    margin-top: 6px;
    padding: 8px 10px;
    border-left: 2px solid var(--um-maize);
    background: rgba(255, 203, 5, .06);
    border-radius: 6px;
    transition: color .5s ease, border-color .5s ease, background .5s ease;
  }
  .weight-desc.shown{ display: block; }
  body.over-budget .weight-desc{
    border-left-color: #ff9b7d;
    background: rgba(255, 155, 125, .06);
    color: rgba(255, 205, 195, .88);
  }

  .weight-control{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
  }

  .weight-btn{
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid rgba(176, 200, 235, .28);
    background: rgba(226, 238, 255, .10);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background .15s ease, border-color .15s ease, transform .1s ease, color .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .weight-btn:hover{
    background: rgba(255, 203, 5, .20);
    border-color: rgba(255, 203, 5, .55);
    color: var(--um-maize);
  }
  .weight-btn:active{ transform: scale(.94); }

  .weight-btn:disabled,
  .weight-btn:disabled:hover,
  .weight-btn:disabled:active{
    cursor: default;
    pointer-events: none;
    background: rgba(226, 238, 255, .03);
    border-color: rgba(176, 200, 235, .10);
    color: rgba(200, 214, 230, .28);
    transform: none;
    box-shadow: none;
  }
  body.over-budget .weight-btn:disabled,
  body.over-budget .weight-btn:disabled:hover,
  body.over-budget .weight-btn:disabled:active{
    background: rgba(255, 155, 125, .03);
    border-color: rgba(180, 80, 60, .12);
    color: rgba(255, 180, 170, .30);
  }

  .weight-count{
    min-width: 20px;
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--um-maize);
    transition: color .5s ease;
  }
  body.over-budget .weight-count{ color: #ff9b7d; }

  .settings-footer{
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(176, 200, 235, .16);
    display: flex;
    justify-content: center;
    transition: border-color .5s ease;
  }
  body.over-budget .settings-footer{ border-top-color: rgba(180, 80, 60, .30); }

  .restart-btn{
    appearance: none;
    padding: 12px 28px;
    border-radius: 999px;
    border: 1px solid rgba(255, 168, 148, .60);
    background: linear-gradient(135deg, #b8473a 0%, #9A3324 52%, #742116 100%);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255, 220, 210, .30),
      0 4px 14px rgba(154, 51, 36, .30);
    transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .restart-btn:hover{
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 220, 210, .35),
      0 6px 18px rgba(154, 51, 36, .40);
  }
  .restart-btn:active{ transform: scale(.97); }

  /* ---------- 小屏适配 ---------- */
  @media (max-width: 520px){
    :root{
      --gap: 22px;
      --box-pad: 20px;
    }

    .dice-grid{
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding-right: 10px;
    }
    .die{ max-width: 72px; }
    .die-value{ font-size: 22px; }
    .bubble{ font-size: 14px; padding: 10px 15px; }

    .roll-btn,
    .random-btn{ padding: 14px 38px; font-size: 15px; }

    .emoji-row{
      gap: 12px;
      padding: var(--gap) 18px 0;
    }
    .emoji-bubble{ width: 48px; height: 48px; font-size: 23px; border-radius: 14px; }

    .mood-row{ padding: var(--gap) 16px 0; }

    .cuisine-grid{
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }
    .cuisine-card{
      min-height: 84px;
      padding: 16px 5px;
      font-size: 12.5px;
    }

    .future-grid{ gap: 8px; }
    .future-card{
      min-height: 148px;
      padding: 14px 10px;
      gap: 8px;
    }
    .future-title{ font-size: 12px; }
    .future-text{ font-size: 11px; line-height: 1.55; }

    .budget-panel{
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .avatar-col{
      height: 170px;
      min-height: 170px;
      padding: 6px 0;
    }
    .avatar{ max-width: 84px; }
    .dropped-food{ font-size: 24px; }

    .budget-row{ font-size: 13px; }
    .budget-value{ font-size: 15px; }

    .record-input,
    .record-textarea{ font-size: 13px; padding: 9px 12px; }

    .add-btn{ align-self: stretch; }

    .modal{ max-height: 88vh; }
    .modal-header{ padding: 14px 16px 12px; }
    .modal-title{ font-size: 16px; }
    .modal-body{ padding: 14px 16px 18px; }
    .weight-row{ grid-template-columns: 1fr auto; }
  }
  @media (max-width: 480px){
    .collapsed-summary{
      grid-template-columns: 1fr;
      gap: 8px;
    }
  }
  @media (max-width: 380px){
    .die-value{ font-size: 20px; }
    .emoji-row{ gap: 10px; }

    .cuisine-grid{
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .cuisine-card{
      min-height: 78px;
      font-size: 12px;
    }

    .budget-row{ flex-wrap: wrap; }

    .top-btn{ padding: 6px 12px; font-size: 12px; }
    .user-id{ font-size: 13px; }
  }
  @media (max-width: 340px){
    .future-grid{ grid-template-columns: 1fr; }
    .future-card{ min-height: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .emoji-bubble{ transition: none; }
    .emoji-layer, .mood-layer{ transition: none; }
    .cuisine-card{ transition: none; }
    .future-card{ transition: none; }
    .box.reveal-in{ animation: none; }
    .future-card.shown{ animation-duration: .01ms; }
    .avatar, .avatar-arm, .avatar-head, .avatar-legs{ animation: none; }
    .dropped-food.dropping{ animation-duration: .01ms; }
    .avatar-col:hover .dropped-food.landed{ animation: none; }
    body.over-budget .avatar-tear{ animation: none; opacity: .9; }
    body.over-budget .dumbbell-dropped{ animation: none; opacity: .9; }
  }
</style>

<!-- 顶部横幅：全宽固定，无圆角，囊括 ID + 规则 + 设置 -->
<div class="banner">

    </div>
  </div>
</div>

<div class="stack">

      <span class="summary-label">彩蛋卡片</span>
      <span class="summary-value" id="summaryFuture">--</span>
    </div>
  </div>

  <button class="collapse-banner" id="collapseBanner" type="button" hidden>
    <span class="btn-label">展开上方内容</span>

  <!-- ===== Box 1 ===== -->
  <section class="box" id="box1">
    <div class="dice-grid" id="diceGrid"></div>

        <span class="cuisine-name">墨西哥菜系</span>

        <span class="cuisine-name">清真菜系</span>

        </div>
